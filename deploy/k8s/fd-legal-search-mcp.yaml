# fd-legal-search-mcp — prod (fd-prod)
# 识律法律检索 MCP（lex-platform-v1；FastMCP streamable-http /mcp on :8000）。
# env ← Secret fd-legal-search-env（键名表见 deploy/README.md；清单不含明文）。
# 资源档：requests 保持轻（fd-prod 余量小），但 limits 必须给足——256Mi 的旧值
# 导致 13 天 12 次 OOMKilled（exit 137，实测 2026-10-19），判卷文书正文时进程
# 峰值远超该值。1Gi 是「单篇正文 + 解压块 + 连接池」的安全边际；正文返回体积
# 已在工具侧收紧（默认 12k 字符），此处是第二道保护而非唯一防线。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fd-legal-search-mcp
  namespace: fd-prod
  labels:
    app.kubernetes.io/name: fd-legal-search-mcp
    app.kubernetes.io/part-of: finddata
    app.kubernetes.io/environment: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fd-legal-search-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fd-legal-search-mcp
        app.kubernetes.io/part-of: finddata
        app.kubernetes.io/environment: production
    spec:
      containers:
        - name: mcp
          # 2026-11-12 sha-87f4fe9：线自有共享 bearer 门（change converge-line-identity-and-keys 8.6），
          # 源真 2fb9191（github 线）。
          # 2026-11-13 sha-5976f65：+ /.well-known/line-manifest.json 自描述端点（1.4 投影，公开免鉴权；
          # 镜像新增 COPY line-manifest.json，门的 EXEMPT_PATHS 同步加该路径）；回滚=sha-87f4fe9
          image: ccr.ccs.tencentyun.com/finddata-business/fd-legal-search-mcp:sha-6e88496 # 8.6 共享 bearer 门（默认关闭）+ /health,/healthz 探针豁免 + /.well-known 自描述端点（1.4 投影，公开免鉴权、清单随镜像）｜2026-11-15 sha-6e88496：词元客户轨（门 K 线票离线验签，converge-line-identity-and-keys 8.7）——**行为中性**：生产尚未配 FD_LEGAL_SEARCH_LINE_TOKEN_*，词元轨 not_configured，与旧片等价；镜像内已实测『无票 401 / 共享钥匙 406 / 本线好票 406 / 别线 source·aud 401 / 超 600s TTL 401』，/.well-known 匿名 200｜镜像仓 scs001 同步 6e88496（补 line_token.py + 两个用例 + auth/cli/pyproject）｜回滚=sha-29f7cb9
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 3
          envFrom:
            - secretRef:
                name: fd-legal-search-env
          env:
            # 8.6 翻转第二步：与注册表 backend auth 的 auth_credential 必须逐字节相同
            # （注册表在出口把 Authorization 换成这把令牌；本线门按 Bearer 精确比较）。
            # 未设=门不存在（与接入前逐字节一致）；设了才生效。值只在 Secret 里。
            - name: MCP_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: fd-legal-search-line-token
                  key: MCP_BEARER_TOKEN
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { cpu: 500m, memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: fd-legal-search-mcp
  namespace: fd-prod
  labels:
    app.kubernetes.io/name: fd-legal-search-mcp
    app.kubernetes.io/part-of: finddata
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: fd-legal-search-mcp
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 31884
