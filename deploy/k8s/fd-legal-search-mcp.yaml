# fd-legal-search-mcp — prod (fd-prod)
# 识律法律检索 MCP（lex-platform-v1；FastMCP streamable-http /mcp on :8000）。
# env ← Secret fd-legal-search-env（键名表见 deploy/README.md；清单不含明文）。
# 资源轻档：fd-prod requests.memory 余量小（wire 同约束），requests 合计须克制。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fd-legal-search-mcp
  namespace: fd-prod
  labels:
    app.kubernetes.io/name: fd-legal-search-mcp
    app.kubernetes.io/part-of: finddata
    app.kubernetes.io/environment: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fd-legal-search-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fd-legal-search-mcp
        app.kubernetes.io/part-of: finddata
        app.kubernetes.io/environment: production
    spec:
      containers:
        - name: mcp
          image: ccr.ccs.tencentyun.com/finddata-business/fd-legal-search-mcp:sha-1c844e3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 3
          envFrom:
            - secretRef:
                name: fd-legal-search-env
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: fd-legal-search-mcp
  namespace: fd-prod
  labels:
    app.kubernetes.io/name: fd-legal-search-mcp
    app.kubernetes.io/part-of: finddata
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: fd-legal-search-mcp
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 31884
